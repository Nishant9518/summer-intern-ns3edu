<!DOCTYPE html>
<html>
<head>
    <title>CSS Position Example</title>

    <style>
        body {
            height: 1500px;
            font-family: Arial, sans-serif;
            background-color: rgb(0, 255, 170);
        }

        /* Static Position (default) */
        .static-box {
            position: static;
            width: 150px;
            height: 100px;
            background-color: lightblue;
            padding: 10px;
            margin: 20px;
        }

        /* Relative Position */
        .relative-box {
            position: relative;
            width: 150px;
            height: 100px;
            background-color: lightgreen;
            left: 50px;
            top: 20px;
            padding: 10px;
            z-index: 2;
        }

        /* Parent for absolute position */
        .container {
            position: relative;
            width: 400px;
            height: 250px;
            background-color: lightgray;
            margin: 50px;
        }

        /* Absolute Position */
        .absolute-box {
            position: absolute;
            width: 150px;
            height: 100px;
            background-color: orange;
            top: 50px;
            left: 100px;
            z-index: 3;
            padding: 10px;
        }

        /* Fixed Position */
        .fixed-box {
            position: fixed;
            width: 150px;
            height: 70px;
            background-color: red;
            color: white;
            right: 20px;
            bottom: 20px;
            padding: 10px;
            z-index: 5;
        }

        /* z-index Example */
        .box1 {
            position: absolute;
            width: 120px;
            height: 120px;
            background-color: purple;
            top: 450px;
            left: 50px;
            z-index: 1;
        }

        .box2 {
            position: absolute;
            width: 120px;
            height: 120px;
            background-color: yellow;
            top: 480px;
            left: 90px;
            z-index: 4;
        }

    </style>
</head>

<body>

    <h1>CSS Position Property</h1>

    <div class="static-box">
        Static Position
    </div>

    <div class="relative-box">
        Relative Position
    </div>

    <div class="container">
        Parent Container
        <div class="absolute-box">
            Absolute Position
        </div>
    </div>

    <div class="fixed-box">
        Fixed Position
    </div>

    <div class="box1">
        z-index 1
    </div>

    <div class="box2">
        z-index 4
    </div>

</body>
</html>
